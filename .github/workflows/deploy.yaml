name: Deploy React CSR
on: 
  push:
  workflow_dispatch:
jobs:
  lint:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v5
        - name: Setup Node.js
          uses: actions/setup-node@v5
          with:
            node-version: 22
        - run: npm ci
        - run: npm test
        - name: Run lint 
          run: npm run lint

  deploy:
      needs: lint
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v5
        - name: Setup Node.js
          uses: actions/setup-node@v5
          with:
            node-version: 22
        - run: npm ci
        - run: npm run build
        - name: Deploy to GitHub Pages
          run: echo "Deploying to GitHub Pages."
